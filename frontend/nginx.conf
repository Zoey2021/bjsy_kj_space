server {
    listen 80;
    server_name localhost;

    # Docker 内置 DNS：变量式 proxy_pass 会在请求时再解析，
    # 避免 game01（PBL 默认不启动）导致 nginx 启动直接失败 → 整站 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20m;

    # Docker overlayfs 上 sendfile 常把较大的 JS/CSS 传成空响应，浏览器拿到空壳就白屏
    sendfile off;
    tcp_nopush off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA 入口：避免浏览器长期缓存旧 index，导致路由已更新但仍加载旧 JS 分块
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location ~* ^/pdfjs/.+\.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
    }

    # 校本课件 / 电子教材：一律跳转 OSS，不占 ECS 带宽与磁盘
    # 桶：learn-space-static（华北2 北京）
    location ^~ /school/ {
        return 301 https://learn-space-static.oss-cn-beijing.aliyuncs.com$request_uri;
    }

    location ^~ /textbooks/ {
        return 301 https://learn-space-static.oss-cn-beijing.aliyuncs.com$request_uri;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        sendfile off;
        gzip on;
        gzip_comp_level 5;
        gzip_types text/css application/javascript application/json;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 课时页随发布替换，不能按地址缓存旧稿
    location ^~ /lessons/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 封面/登录图等静态图片：长期缓存，减少重复下载
    location ~* \.(png|jpe?g|gif|webp|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 项目化 PBL（game01）暂不反代，避免未启动时拖垮整站。
    # 需要时再用：docker compose --profile pbl up -d game01，并恢复 /pbl-app/ 配置。

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 学生端 SSE：仅这一条关闭缓冲
    location /api/learn/sse {
        proxy_pass http://backend:8080/api/learn/sse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # AI 生成较慢，单独加长超时（须写在 /api/ 之前）
    location = /api/teacher/scaffold/generate {
        proxy_pass http://backend:8080/api/teacher/scaffold/generate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }

    # 小派老师流式对话
    location = /api/ai-lab/coze/chat {
        proxy_pass http://backend:8080/api/ai-lab/coze/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }

    # 小派老师图片上传（手机拍照常 >1MB）
    location = /api/ai-lab/upload {
        proxy_pass http://backend:8080/api/ai-lab/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        client_max_body_size 12m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 普通 API（含班级码登录 POST）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        client_max_body_size 12m;
    }
}
