server {
    listen 80;
    server_name localhost;

    # Docker overlayfs 上 sendfile 常把较大的 JS/CSS 传成空响应，浏览器拿到空壳就白屏
    sendfile off;
    tcp_nopush off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA 入口：避免浏览器长期缓存旧 index，导致路由已更新但仍加载旧 JS 分块
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location ~* ^/pdfjs/.+\.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
    }

    location /textbooks/ {
        root /usr/share/nginx/html;
        default_type application/pdf;
        add_header Cache-Control "public, max-age=3600";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        sendfile off;
        gzip off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 封面/登录图等静态图片：长期缓存，减少重复下载
    location ~* \.(png|jpe?g|gif|webp|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 学生端 SSE：仅这一条关闭缓冲
    location /api/learn/sse {
        proxy_pass http://backend:8080/api/learn/sse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # AI 生成较慢，单独加长超时（须写在 /api/ 之前）
    location = /api/teacher/scaffold/generate {
        proxy_pass http://backend:8080/api/teacher/scaffold/generate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }

    # 普通 API（含班级码登录 POST）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
    }
}
