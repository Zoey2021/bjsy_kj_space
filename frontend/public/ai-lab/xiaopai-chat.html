<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小派老师 · Python编程小导师</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --paper: #f1f5f9;
    --panel: #ffffff;
    --accent: #0e7490;
    --accent-deep: #155e75;
    --user: #0f172a;
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background:
      radial-gradient(800px 380px at 8% -8%, rgba(14, 116, 144, 0.12), transparent 55%),
      radial-gradient(640px 320px at 100% 0%, rgba(100, 116, 139, 0.10), transparent 50%),
      linear-gradient(180deg, #e8eef5 0%, var(--paper) 45%, #e2e8f0 100%);
    color: var(--ink);
    font-family: var(--sans);
  }
  .app {
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header.top {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(12px);
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(145deg, #155e75, #0e7490 60%, #22d3ee);
    color: #ecfeff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    box-shadow: 0 6px 14px rgba(14, 116, 144, 0.25);
    flex-shrink: 0;
  }
  .who { min-width: 0; }
  .who h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.2;
  }
  .who p {
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
  }
  .badge {
    margin-left: auto;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-deep);
    background: rgba(14, 116, 144, 0.08);
    border: 1px solid rgba(14, 116, 144, 0.14);
    border-radius: 999px;
    padding: 4px 9px;
    white-space: nowrap;
  }
  .messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 18px 10px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tip {
    align-self: center;
    max-width: 520px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.65;
    padding: 10px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,.45);
    border: 1px solid var(--line);
  }
  .msg {
    max-width: min(78%, 640px);
    padding: 11px 14px;
    border-radius: 16px;
    line-height: 1.65;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: rise .28s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .user {
    align-self: flex-end;
    background: var(--user);
    color: #f5f5f4;
    border-bottom-right-radius: 5px;
    box-shadow: 0 8px 20px rgba(30, 58, 58, 0.18);
  }
  .bot {
    align-self: flex-start;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
    box-shadow: var(--shadow);
  }
  .bot strong { font-weight: 700; }
  .bot a { color: var(--accent-deep); }
  .bot code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: rgba(14, 116, 144, 0.08);
    padding: 1px 5px;
    border-radius: 5px;
  }
  .bot pre {
    background: #0f172a;
    color: #e2e8f0;
    padding: 12px 14px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12.5px;
    font-family: var(--mono);
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .composer {
    flex-shrink: 0;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, transparent, rgba(241, 245, 249, 0.95) 30%);
  }
  .inputbar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
  }
  textarea {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 10px 8px;
    font-size: 14.5px;
    font-family: var(--sans);
    resize: none;
    outline: none;
    height: 44px;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.45;
    color: var(--ink);
  }
  textarea::placeholder { color: #a8a29e; }
  .btn {
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--sans);
    flex-shrink: 0;
  }
  .send {
    background: var(--accent);
    color: #fff;
    padding: 0 16px;
    min-height: 42px;
    transition: background .15s ease, transform .15s ease;
  }
  .send:hover { background: var(--accent-deep); }
  .send:active { transform: translateY(1px); }
  .send:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .upload {
    width: 42px;
    min-height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #f1f5f9;
    color: var(--ink);
    font-size: 16px;
  }
  .upload:hover { background: rgba(14, 116, 144, 0.12); color: var(--accent-deep); }
  .attach { display: none; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="avatar" aria-hidden="true">Py</div>
    <div class="who">
      <h1>小派老师</h1>
      <p>六年级 Python 编程小导师</p>
    </div>
    <span class="badge">在线辅导</span>
  </header>
  <div class="messages" id="messages">
    <div class="tip">你好，我是小派老师。可以问 Python 问题，也可以上传算法流程图一起看。</div>
  </div>
  <div class="composer">
    <div class="inputbar">
      <label class="btn upload" title="上传图片（算法流程图 / 草稿）">＋<input class="attach" type="file" id="file" accept="image/*"></label>
      <textarea id="input" placeholder="例如：怎么用 Python 算平均分？"></textarea>
      <button class="btn send" id="send">发送</button>
    </div>
  </div>
</div>

<script>
/** 同源代理：JWT 登录校验；扣子 Token 由后端注入；图片先上传再传 URL */
const CONFIG = {
  API_URL: "/api/ai-lab/coze/chat",
  TOKEN: "",
  UPLOAD_URL: "/api/ai-lab/upload"
};
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const fileEl = document.getElementById("file");
let sessionId = "web_" + Date.now();
/** 已上传图片的公开 URL（非 base64） */
let hasImageUrl = null;
let uploading = false;

function authHeaders(extra) {
  const headers = extra ? Object.assign({}, extra) : {};
  const jwt = localStorage.getItem("token") || "";
  if (jwt) headers["Authorization"] = "Bearer " + jwt;
  if (CONFIG.TOKEN) headers["Authorization"] = "Bearer " + CONFIG.TOKEN;
  return headers;
}

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.innerHTML = _render(text);
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return d;
}
function _render(text) {
  const esc = String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return esc.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code){ return '<pre>' + code + '</pre>'; })
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
}

/** 手机大图先压到约 1280 边长，降低上传失败概率 */
function compressImage(file) {
  return new Promise(function(resolve) {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) {
      resolve(file);
      return;
    }
    if (file.size < 900 * 1024) {
      resolve(file);
      return;
    }
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function() {
      URL.revokeObjectURL(url);
      var max = 1280;
      var w = img.width, h = img.height;
      if (w > max || h > max) {
        if (w >= h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob) {
        if (!blob) { resolve(file); return; }
        var name = (file.name || "image.jpg").replace(/\.\w+$/, ".jpg");
        resolve(new File([blob], name, { type: "image/jpeg" }));
      }, "image/jpeg", 0.82);
    };
    img.onerror = function() {
      URL.revokeObjectURL(url);
      resolve(file);
    };
    img.src = url;
  });
}

function toAbsoluteUrl(url) {
  if (!url) return url;
  if (/^https?:\/\//i.test(url)) {
    if (url.indexOf("http://bjsysmartedu.cn") === 0) {
      return "https://" + url.slice("http://".length);
    }
    return url;
  }
  var origin = window.location.origin || "";
  if (origin.indexOf("http://bjsysmartedu.cn") === 0) origin = "https://bjsysmartedu.cn";
  if (url.charAt(0) !== "/") url = "/" + url;
  return origin + url;
}

async function uploadImage(file) {
  var prepared = await compressImage(file);
  const form = new FormData();
  form.append("file", prepared);
  const resp = await fetch(CONFIG.UPLOAD_URL, {
    method: "POST",
    headers: authHeaders(),
    body: form
  });
  const json = await resp.json().catch(function(){ return null; });
  if (!resp.ok || !json || (json.code !== 0 && json.code !== 200)) {
    var msg = (json && json.message) ? json.message : ("上传失败 " + resp.status);
    if (resp.status === 413) msg = "图片太大，请换一张较小的图";
    throw new Error(msg);
  }
  const data = json.data || {};
  const url = toAbsoluteUrl(data.url || data.path);
  if (!url) throw new Error("上传成功但未返回图片地址");
  return url;
}

async function send() {
  if (uploading) {
    addMsg("bot", "图片还在上传，请稍等一下再发送。");
    return;
  }
  const text = inputEl.value.trim();
  const img = hasImageUrl;
  if (!text && !img) return;
  addMsg("user", (img ? "[图片] " : "") + text);
  inputEl.value = "";
  hasImageUrl = null;
  fileEl.title = "上传图片（算法流程图 / 草稿）";
  const content = [];
  if (text) content.push({ type: "text", text: text });
  if (img) content.push({ type: "image_url", image_url: { url: img } });
  const botBox = addMsg("bot", "思考中…");
  sendBtn.disabled = true;
  try {
    const resp = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({
        model: "default",
        session_id: sessionId,
        stream: true,
        messages: [{ role: "user", content: content }]
      })
    });
    if (!resp.ok) {
      let detail = "";
      try { detail = await resp.text(); } catch (e) {}
      botBox.innerHTML = "请求失败：" + resp.status + (detail ? ("<br>" + _render(detail.slice(0, 200))) : "");
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "", full = "", started = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, idx).trim(); buffer = buffer.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const obj = JSON.parse(data);
          if (obj.error && obj.error.message) {
            botBox.innerHTML = _render(obj.error.message);
            started = true;
            continue;
          }
          if (obj.content && obj.content.error) {
            var errObj = obj.content.error;
            var errMsg = (typeof errObj === "string") ? errObj : (errObj.message || JSON.stringify(errObj));
            botBox.innerHTML = _render(errMsg);
            started = true;
            continue;
          }
          let piece = "";
          const delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
          if (delta && delta.content) piece = delta.content;
          if (!piece && obj.type === "answer" && obj.content && obj.content.answer) {
            piece = obj.content.answer;
          }
          if (piece) {
            if (!started) { botBox.innerHTML = ""; started = true; }
            full += piece;
            botBox.innerHTML = _render(full);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch (e) {}
      }
    }
    if (!started) botBox.innerHTML = _render(full || "(暂无回复)");
  } catch (e) {
    botBox.innerHTML = "连接失败：" + e.message;
  } finally {
    sendBtn.disabled = false;
  }
}

inputEl.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);
fileEl.addEventListener("change", async function(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  uploading = true;
  sendBtn.disabled = true;
  const tip = addMsg("bot", "正在上传图片…");
  try {
    hasImageUrl = await uploadImage(f);
    tip.innerHTML = _render("图片已上传，输入问题后点发送即可。");
  } catch (err) {
    hasImageUrl = null;
    tip.innerHTML = _render("图片上传失败：" + (err.message || "请重试"));
  } finally {
    uploading = false;
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
