<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进一步学习 - Python+AI小游戏设计课程</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background-color: #f0f7ff;
            background-image: radial-gradient(#b8d4ff 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #4d8eff;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(77, 142, 255, 0.2);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
            color: white;
            text-decoration: none;
        }
        
        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .main-content {
            background-color: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .main-title {
            font-size: 2.5rem;
            color: #2c5aa0;
            margin-bottom: 30px;
            font-weight: bold;
            line-height: 1.5;
        }
        
        .icon {
            font-size: 5rem;
            color: #4d8eff;
            margin-bottom: 30px;
        }
        
        .content-text {
            font-size: 1.3rem;
            color: #666;
            line-height: 1.8;
            margin-top: 20px;
        }
        
        .next-button {
            margin-top: 40px;
            background: linear-gradient(135deg, #4d8eff 0%, #2c5aa0 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(77, 142, 255, 0.3);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .next-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(77, 142, 255, 0.4);
        }
        
        .next-button:active {
            transform: translateY(0);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .main-title {
                font-size: 1.8rem;
            }
            
            .icon {
                font-size: 3rem;
            }
            
            .content-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="/second" class="back-button">
                <i class="fas fa-arrow-left"></i> 返回课程列表
            </a>
            <h1><i class="fab fa-python"></i> Python+AI小游戏设计课程</h1>
            <p class="subtitle">进一步学习</p>
        </header>
        
        <div class="main-content">
            <div class="icon">
                <i class="fas fa-lightbulb"></i>
            </div>
            <h2 class="main-title">第2课界定问题，并找出变量与规则</h2>
            <p class="content-text">
                在这里，你将深入学习如何界定游戏问题，识别关键变量，并制定清晰的游戏规则。
            </p>
            <button class="next-button" id="next-study-btn">
                <i class="fas fa-arrow-right"></i> 下一步学习
            </button>
        </div>
    </div>
    
    <script>
        // 从URL获取访问码
        const urlParams = new URLSearchParams(window.location.search);
        const accessCode = urlParams.get('access_code');
        
        // 下一步学习按钮
        document.getElementById('next-study-btn').addEventListener('click', () => {
            if (accessCode) {
                // 通过访问码跳转到AI学习助手页面
                window.location.href = `/ai-study?access_code=${accessCode}`;
            } else {
                alert('缺少访问码，请从团队详情页进入');
                window.location.href = '/second';
            }
        });
    </script>
</body>
</html>
