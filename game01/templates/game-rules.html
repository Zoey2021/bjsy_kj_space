<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏规则与变量 - Python+AI小游戏设计课程</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background-color: #f0f7ff;
            background-image: radial-gradient(#b8d4ff 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #4d8eff;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(77, 142, 255, 0.2);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
            color: white;
        }
        
        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .main-content {
            background-color: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .main-title {
            font-size: 3rem;
            color: #2c5aa0;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .icon {
            font-size: 5rem;
            color: #4d8eff;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .main-title {
                font-size: 2rem;
            }
            
            .icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="back-button" onclick="window.location.href='/second'">
                <i class="fas fa-arrow-left"></i> 返回课程列表
            </button>
            <h1><i class="fab fa-python"></i> Python+AI小游戏设计课程</h1>
            <p class="subtitle">课程2：游戏规则与变量</p>
        </header>
        
        <div class="main-content">
            <div class="icon">
                <i class="fas fa-clipboard-check"></i>
            </div>
            <h2 class="main-title">确认变量和规则</h2>
        </div>
    </div>
</body>
</html>
