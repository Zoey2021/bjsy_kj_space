# Docker 环境配置（由 docker-compose 激活）
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/learn_space?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: learnuser
    password: learnpass123

dify:
  base-url: http://host.docker.internal:8090/v1
  recommend-api-key: ${DIFY_RECOMMEND_API_KEY:}
  recommend-app-mode: workflow
  interactive-api-key: ${DIFY_INTERACTIVE_API_KEY:}
  interactive-app-mode: workflow

ai:
  api-key: ${AI_API_KEY:}
  app-id: ${AI_APP_ID:aa1496e342e14d439f8ecb8fe378b11e}
  app-base-url: ${AI_APP_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
  pass-biz-params: ${AI_PASS_BIZ_PARAMS:true}
  base-url: ${AI_BASE_URL:}
  model: ${AI_MODEL:}

learn-space:
  activity:
    html-output-dir: /app/lesson-generated
    lesson-html-dir: /app/lessons
